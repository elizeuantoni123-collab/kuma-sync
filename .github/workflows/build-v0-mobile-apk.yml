name: Build V0 Mobile APK

on:
  push:
    branches: [ v0-mobile-android-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct isolated V0 Android source
        shell: bash
        run: |
          cat > /tmp/v0_minimal.tar.gz.b64 <<'V0ARCHIVE'

V0ARCHIVE
          base64 -d /tmp/v0_minimal.tar.gz.b64 > /tmp/v0_minimal.tar.gz
          tar -xzf /tmp/v0_minimal.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Validate project
        run: python3 scripts/validate_project.py

      - name: Run portable core tests
        run: bash scripts/test_host.sh

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee APK_SHA256.txt
          cp "$APK" V0_MOBILE_ANDROID_DEBUG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V0_MOBILE_ANDROID_DEBUG
          path: |
            V0_MOBILE_ANDROID_DEBUG.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 14
