<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Legendador de Imóveis</title>
<style>
:root{--bg:#121212;--panel:#1d1d1d;--panel2:#272727;--ink:#f7f7f7;--mut:#b4b4b4;--line:#3d3d3d;--yellow:#ffd400;--blue:#19b9ff;--green:#51d88a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.app{max-width:1100px;margin:auto;padding:8px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px}
.stage{position:relative;background:#000;border-radius:14px;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
canvas{display:block;max-width:100%;max-height:72vh;touch-action:none;user-select:none;-webkit-user-select:none}
.empty{color:#aaa;padding:40px 18px;text-align:center}.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;align-self:start}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:transparent;color:var(--mut);padding:13px;font-weight:700}.tabs button.on{color:#111;background:var(--yellow)}.pane{display:none;padding:12px;gap:10px;flex-direction:column}.pane.on{display:flex}.row{display:flex;gap:8px}.row>*{flex:1}.btn,input,select,textarea{font:inherit}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:10px;min-height:44px;padding:9px 12px;font-weight:700}.btn.primary{background:var(--yellow);color:#111;border-color:var(--yellow)}.btn.danger{color:#ff8c84}label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}textarea,select,input[type=text]{background:#111;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px}textarea{min-height:78px}.layers{display:flex;gap:6px;flex-wrap:wrap}.layers button{background:#111;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:6px 9px}.layers button.on{background:var(--yellow);color:#111;border-color:var(--yellow)}.hint{font-size:12px;color:var(--mut)}
.inlineEdit{position:fixed;z-index:50;display:none;background:rgba(20,20,20,.97);border:2px solid var(--yellow);border-radius:10px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.45)}.inlineEdit.on{display:block}.inlineEdit input{width:100%;font-size:18px;font-weight:800;background:#080808;color:#fff;border:0;border-radius:6px;padding:10px;outline:none}.inlineBtns{display:flex;gap:6px;margin-top:6px}.inlineBtns button{flex:1;min-height:36px}
.progress{display:none;gap:8px;align-items:center}.progress.on{display:flex}.bar{height:12px;background:#0d0d0d;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex:1}.bar>div{height:100%;width:0;background:var(--yellow);transition:width .12s linear}.pct{min-width:48px;text-align:right;font-weight:800}
.legend{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--mut)}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.dot.blue{background:var(--blue)}.dot.yellow{background:var(--yellow)}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:6px;gap:6px}.stage{min-height:240px;border-radius:10px}.side{border-radius:10px}.side .pane{padding:10px}canvas{max-height:63vh}.stageFirst{order:0}.side{order:1}.editorDetails{display:none!important}.inlineEdit input{font-size:17px}.inlineEdit{left:8px!important;right:8px!important;width:auto!important;max-width:none!important}.legend{justify-content:center}}
</style>
</head>
<body>
<div class="app">
  <div class="stage stageFirst" id="stage">
    <div class="empty" id="empty">Escolha uma foto ou vídeo para começar.</div>
    <canvas id="cv" hidden></canvas>
  </div>
  <div class="side">
    <div class="tabs"><button class="on" data-tab="media">Mídia</button><button data-tab="text">Texto</button></div>
    <div class="pane on" id="mediaPane">
      <label>Foto ou vídeo<input id="file" type="file" accept="video/*,image/*"></label>
      <div class="row" id="videoControls" hidden><button class="btn" id="play">Pausar</button></div>
      <button class="btn primary" id="export" disabled>Baixar resultado</button>
      <div class="progress" id="progress"><div class="bar"><div id="barFill"></div></div><div class="pct" id="pct">0%</div></div>
      <div class="hint" id="msg">O vídeo será exportado mantendo a proporção original.</div>
    </div>
    <div class="pane" id="textPane">
      <div class="row"><button class="btn primary" id="add">+ Texto</button><button class="btn" id="preset">Modelo imóvel</button></div>
      <div class="layers" id="layers"></div>
      <label>Adicionar logo/imagem<input id="overlayFile" type="file" accept="image/*"></label>
      <div class="legend"><span><i class="dot blue"></i>linha</span><span><i class="dot yellow"></i>bloco inteiro</span></div>
      <div class="editorDetails" id="details">
        <label>Texto do bloco<textarea id="tx"></textarea></label>
        <label>Fonte<select id="font"><option>Arial Black</option><option>Impact</option><option>Verdana</option><option>Tahoma</option><option>Georgia</option></select></label>
        <label>Tamanho da linha<input id="size" type="range" min="2" max="28" step=".1"></label>
        <div class="row"><label>Cor<input id="fill" type="color"></label><label>Contorno<input id="stroke" type="color"></label></div>
        <label>Contorno<input id="sw" type="range" min="0" max="10" step=".5"></label>
        <label>Sombra<input id="sh" type="range" min="0" max="10" step=".5"></label>
        <button class="btn danger" id="del">Excluir</button>
      </div>
      <div class="hint">Toque em uma linha para selecionar. Toque duas vezes para editar em cima da imagem. Cantos azuis mudam só a linha; cantos amarelos mudam o bloco inteiro.</div>
    </div>
  </div>
</div>
<div class="inlineEdit" id="inlineEdit"><input id="inlineInput" type="text"><div class="inlineBtns"><button class="btn primary" id="inlineOk">OK</button><button class="btn" id="inlineCancel">Cancelar</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
let media=null,kind=null,layers=[],sel=-1,selLine=0,nid=1,exporting=false;
let drag=null,resize=null,pinch=null,lastTap={time:0,layer:-1,line:-1};
const pointers=new Map();
const BLUE='#19b9ff',YELLOW='#ffd400';
const mk=(o={})=>({id:nid++,text:'Seu texto',font:'Arial Black',size:6,lineSizes:[],fill:'#ffffff',stroke:'#000000',sw:3,sh:3,x:.5,y:.5,...o});

function setTab(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('mediaPane').classList.toggle('on',tab==='media');$('textPane').classList.toggle('on',tab==='text')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

function ensureSizes(L){const a=L.text.split('\n');while(L.lineSizes.length<a.length)L.lineSizes.push(L.size);if(L.lineSizes.length>a.length)L.lineSizes.length=a.length;return a}
function pctSize(L,j){ensureSizes(L);return L.lineSizes[j]||L.size}
function setLineSize(L,j,v){ensureSizes(L);L.lineSizes[j]=Math.max(2,Math.min(28,v));syncDetails()}
function handle(ctx,x,y,color,r=12,square=false){ctx.save();ctx.fillStyle=color;ctx.strokeStyle='#fff';ctx.lineWidth=2;if(square){ctx.beginPath();ctx.rect(x-r,y-r,r*2,r*2)}else{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}ctx.fill();ctx.stroke();ctx.restore()}
function corners(b){return[{x:b.x,y:b.y},{x:b.x+b.w,y:b.y},{x:b.x,y:b.y+b.h},{x:b.x+b.w,y:b.y+b.h}]}
function nearHandle(p,b,r=30){if(!b)return null;for(const h of corners(b)){if(Math.hypot(p.x-h.x,p.y-h.y)<=r)return h}return null}
function inRect(p,b){return !!b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h}

function draw(){
  if(media){
    const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);try{ctx.drawImage(media,0,0,W,H)}catch(_){ }
    layers.forEach((L,li)=>{
      if(L.img){
        const w=L.size/100*W,h=w*(L.img.naturalHeight||1)/(L.img.naturalWidth||1),x=L.x*W-w/2,y=L.y*H-h/2;try{ctx.drawImage(L.img,x,y,w,h)}catch(_){ }
        L.blockRect={x:x-34,y:y-34,w:w+68,h:h+68};L.lineRects=[];
        if(li===sel&&!exporting){ctx.save();ctx.setLineDash([12,7]);ctx.strokeStyle=YELLOW;ctx.lineWidth=3;ctx.strokeRect(L.blockRect.x,L.blockRect.y,L.blockRect.w,L.blockRect.h);corners(L.blockRect).forEach(h=>handle(ctx,h.x,h.y,YELLOW,13,true));ctx.restore()}
        return;
      }
      const lines=ensureSizes(L);const metrics=lines.map((text,j)=>{const fs=pctSize(L,j)/100*W;ctx.font=`800 ${fs}px ${JSON.stringify(L.font)}, sans-serif`;return{text,fs,w:Math.max(16,ctx.measureText(text||' ').width),h:Math.max(32,fs*1.2)}});
      const totalH=metrics.reduce((s,m)=>s+m.h,0);let y=L.y*H-totalH/2;L.lineRects=[];let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      metrics.forEach((m,j)=>{const x=L.x*W,cy=y+m.h/2;y+=m.h;ctx.font=`800 ${m.fs}px ${JSON.stringify(L.font)}, sans-serif`;if(L.sw>0){ctx.shadowColor='transparent';ctx.lineWidth=L.sw*m.fs/30;ctx.strokeStyle=L.stroke;ctx.strokeText(m.text,x,cy)}if(L.sh>0){ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=L.sh*m.fs/11;ctx.shadowOffsetX=ctx.shadowOffsetY=L.sh*m.fs/42}ctx.fillStyle=L.fill;ctx.fillText(m.text,x,cy);ctx.shadowColor='transparent';
        const iw=Math.max(170,m.w+64),ih=Math.max(70,m.h+28);const r={x:x-iw/2,y:cy-ih/2,w:iw,h:ih,cx:x,cy};L.lineRects[j]=r;minX=Math.min(minX,r.x);maxX=Math.max(maxX,r.x+r.w);minY=Math.min(minY,r.y);maxY=Math.max(maxY,r.y+r.h);
      });ctx.restore();
      L.blockRect={x:minX-38,y:minY-38,w:(maxX-minX)+76,h:(maxY-minY)+76};
      if(li===sel&&!exporting){
        const lr=L.lineRects[selLine];if(lr){ctx.save();ctx.setLineDash([7,6]);ctx.strokeStyle=BLUE;ctx.lineWidth=3;ctx.strokeRect(lr.x,lr.y,lr.w,lr.h);corners(lr).forEach(h=>handle(ctx,h.x,h.y,BLUE,12,false));ctx.restore()}
        ctx.save();ctx.setLineDash([13,8]);ctx.strokeStyle=YELLOW;ctx.lineWidth=3;ctx.strokeRect(L.blockRect.x,L.blockRect.y,L.blockRect.w,L.blockRect.h);corners(L.blockRect).forEach(h=>handle(ctx,h.x,h.y,YELLOW,14,true));ctx.restore();
      }
    });
  }
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw);

function canvasPoint(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function hit(p){for(let i=layers.length-1;i>=0;i--){const L=layers[i];if(!L.img&&L.lineRects){for(let j=L.lineRects.length-1;j>=0;j--)if(inRect(p,L.lineRects[j]))return{i,j}}if(inRect(p,L.blockRect))return{i,j:0}}return null}
function select(i,j=0){sel=i;selLine=j;renderLayerButtons();syncDetails();hideInline()}
function scaleFromRect(p,rect,base){const c={x:rect.x+rect.w/2,y:rect.y+rect.h/2};return{center:c,startDist:Math.max(20,Math.hypot(p.x-c.x,p.y-c.y)),base}}

cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=canvasPoint(e);pointers.set(e.pointerId,p);try{cv.setPointerCapture(e.pointerId)}catch(_){ }
  let h=hit(p);if(h){if(sel!==h.i||selLine!==h.j)select(h.i,h.j);const L=layers[sel];
    const blockH=nearHandle(p,L.blockRect,34);const lineR=!L.img&&L.lineRects?L.lineRects[selLine]:null;const lineH=nearHandle(p,lineR,30);
    if(blockH){resize={type:'block',pointer:e.pointerId,...scaleFromRect(p,L.blockRect,1),baseSizes:L.img?[L.size]:ensureSizes(L).map((_,j)=>pctSize(L,j))};drag=null}
    else if(lineH){resize={type:'line',pointer:e.pointerId,...scaleFromRect(p,lineR,pctSize(L,selLine))};drag=null}
    else{drag={pointer:e.pointerId,dx:p.x-L.x*cv.width,dy:p.y-L.y*cv.height};resize=null}
    const now=performance.now();if(now-lastTap.time<330&&lastTap.layer===sel&&lastTap.line===selLine&&!L.img){openInline(sel,selLine)}lastTap={time:now,layer:sel,line:selLine};
  }else select(-1,0);
  if(pointers.size===2&&sel>=0){const pts=[...pointers.values()],L=layers[sel];pinch={start:Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)),baseSizes:L.img?[L.size]:ensureSizes(L).map((_,j)=>pctSize(L,j))};drag=null;resize=null}
},{passive:false});
cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();const p=canvasPoint(e);pointers.set(e.pointerId,p);if(sel<0)return;const L=layers[sel];
  if(pinch&&pointers.size>=2){const pts=[...pointers.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),ratio=d/pinch.start;if(L.img)L.size=Math.max(5,Math.min(100,pinch.baseSizes[0]*ratio));else pinch.baseSizes.forEach((v,j)=>setLineSize(L,j,v*ratio));return}
  if(resize&&resize.pointer===e.pointerId){const d=Math.hypot(p.x-resize.center.x,p.y-resize.center.y),ratio=d/resize.startDist;if(resize.type==='line')setLineSize(L,selLine,resize.base*ratio);else if(L.img)L.size=Math.max(5,Math.min(100,resize.baseSizes[0]*ratio));else resize.baseSizes.forEach((v,j)=>setLineSize(L,j,v*ratio));return}
  if(drag&&drag.pointer===e.pointerId){L.x=Math.max(0,Math.min(1,(p.x-drag.dx)/cv.width));L.y=Math.max(0,Math.min(1,(p.y-drag.dy)/cv.height))}
},{passive:false});
function pointerEnd(e){e.preventDefault();pointers.delete(e.pointerId);if(drag&&drag.pointer===e.pointerId)drag=null;if(resize&&resize.pointer===e.pointerId)resize=null;if(pointers.size<2)pinch=null}
cv.addEventListener('pointerup',pointerEnd,{passive:false});cv.addEventListener('pointercancel',pointerEnd,{passive:false});

function openInline(i,j){const L=layers[i];if(!L||L.img)return;const lines=ensureSizes(L);$('inlineInput').value=lines[j]||'';$('inlineEdit').dataset.layer=i;$('inlineEdit').dataset.line=j;$('inlineEdit').classList.add('on');positionInline();setTimeout(()=>{$('inlineInput').focus();$('inlineInput').select()},30)}
function positionInline(){if(!$('inlineEdit').classList.contains('on')||sel<0)return;const L=layers[sel],r=L.lineRects&&L.lineRects[selLine];if(!r)return;const cr=cv.getBoundingClientRect(),scaleX=cr.width/cv.width,scaleY=cr.height/cv.height;const left=cr.left+r.x*scaleX,top=cr.top+r.y*scaleY,width=Math.max(220,Math.min(window.innerWidth-16,r.w*scaleX));const el=$('inlineEdit');el.style.left=Math.max(8,Math.min(window.innerWidth-width-8,left))+'px';el.style.top=Math.max(8,Math.min(window.innerHeight-135,top))+'px';el.style.width=width+'px'}
window.addEventListener('resize',positionInline);window.addEventListener('scroll',positionInline,{passive:true});
function commitInline(){const el=$('inlineEdit'),i=+el.dataset.layer,j=+el.dataset.line,L=layers[i];if(L&&!L.img){const a=ensureSizes(L);a[j]=$('inlineInput').value;L.text=a.join('\n');renderLayerButtons();syncDetails()}hideInline()}
function hideInline(){$('inlineEdit').classList.remove('on');$('inlineInput').blur()}
$('inlineOk').onclick=commitInline;$('inlineCancel').onclick=hideInline;$('inlineInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitInline()}else if(e.key==='Escape')hideInline()});

function renderLayerButtons(){const box=$('layers');box.innerHTML='';layers.forEach((L,i)=>{const b=document.createElement('button');b.textContent=L.img?'Imagem':(L.text.split('\n')[0]||'(vazio)');b.className=i===sel?'on':'';b.onclick=()=>{select(i,0);setTab('text')};box.appendChild(b)})}
function syncDetails(){const L=layers[sel];$('details').style.display=L?'block':'none';if(!L)return;if(L.img)return;ensureSizes(L);$('tx').value=L.text;$('font').value=L.font;$('size').value=pctSize(L,selLine);$('fill').value=L.fill;$('stroke').value=L.stroke;$('sw').value=L.sw;$('sh').value=L.sh}
$('tx').oninput=()=>{const L=layers[sel];if(!L||L.img)return;L.text=$('tx').value;ensureSizes(L);renderLayerButtons()};$('font').oninput=()=>{const L=layers[sel];if(L&&!L.img)L.font=$('font').value};$('size').oninput=()=>{const L=layers[sel];if(L&&!L.img)setLineSize(L,selLine,+$('size').value)};$('fill').oninput=()=>{const L=layers[sel];if(L&&!L.img)L.fill=$('fill').value};$('stroke').oninput=()=>{const L=layers[sel];if(L&&!L.img)L.stroke=$('stroke').value};$('sw').oninput=()=>{const L=layers[sel];if(L&&!L.img)L.sw=+$('sw').value};$('sh').oninput=()=>{const L=layers[sel];if(L&&!L.img)L.sh=+$('sh').value};
$('add').onclick=()=>{layers.push(mk({x:.5,y:.55}));select(layers.length-1,0);setTab('text');renderLayerButtons()};$('del').onclick=()=>{if(sel<0)return;layers.splice(sel,1);select(-1);renderLayerButtons()};
$('overlayFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{layers.push(mk({img,size:28,x:.5,y:.8}));select(layers.length-1,0);renderLayerButtons()};img.src=URL.createObjectURL(f)};
function applyPreset(){const defaults=[{text:'Sobrado à Venda\nBalneário Camboriú',size:6.6,fill:YELLOW,y:.18},{text:'02 Dormitórios\n02 Banheiros\n01 Vaga garagem privativa\n55,06 área privativa\nÁrea de Lazer Completa',size:5,fill:'#ffffff',y:.38},{text:'R$ 780.000,00',size:9,fill:YELLOW,y:.58}];let texts=layers.filter(L=>!L.img);while(texts.length<3){const d=defaults[texts.length];layers.push(mk({text:d.text,x:.5,y:d.y}));texts=layers.filter(L=>!L.img)}texts.slice(0,3).forEach((L,i)=>{const d=defaults[i];if(!L.text.trim())L.text=d.text;L.font='Arial Black';L.fill=d.fill;L.stroke='#000000';L.sw=3;L.sh=4;L.x=.5;L.y=d.y;L.size=d.size;L.lineSizes=L.text.split('\n').map(()=>d.size)});select(layers.indexOf(texts[0]),0);renderLayerButtons();setTab('text')}
$('preset').onclick=applyPreset;

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);if(f.type.startsWith('video/')){const v=document.createElement('video');v.src=url;v.loop=true;v.muted=true;v.playsInline=true;v.preload='auto';v.onloadedmetadata=()=>{setMedia(v,'video',v.videoWidth,v.videoHeight);v.play().catch(()=>{})}}else{const img=new Image();img.onload=()=>setMedia(img,'image',img.naturalWidth,img.naturalHeight);img.src=url}};
function setMedia(m,k,w,h){media=m;kind=k;const scale=Math.min(1,1920/Math.max(w,h));cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(h*scale));cv.hidden=false;$('empty').hidden=true;$('export').disabled=false;$('videoControls').hidden=k!=='video';if(!layers.filter(L=>!L.img).length)applyPreset();setTab('media')}
$('play').onclick=()=>{if(!media||kind!=='video')return;if(media.paused){media.play();$('play').textContent='Pausar'}else{media.pause();$('play').textContent='Reproduzir'}};

function progressSet(n,label){n=Math.max(0,Math.min(100,n));$('progress').classList.add('on');$('barFill').style.width=n.toFixed(1)+'%';$('pct').textContent=Math.round(n)+'%';if(label)$('msg').textContent=label}
function progressHide(){setTimeout(()=>$('progress').classList.remove('on'),1200)}
async function blobToAndroid(id,blob){const PART=192*1024;for(let off=0;off<blob.size;off+=PART){const bytes=new Uint8Array(await blob.slice(off,Math.min(off+PART,blob.size)).arrayBuffer());let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));AndroidSave.appendChunk(id,btoa(bin))}}
async function saveBlob(blob,name){if(window.AndroidSave){const id=AndroidSave.beginSave(name,blob.type||'application/octet-stream');await blobToAndroid(id,blob);AndroidSave.finishSave(id);return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('export').onclick=async()=>{if(!media)return;const keep=sel,keepLine=selLine;hideInline();sel=-1;exporting=true;$('export').disabled=true;
  try{
    if(kind==='image'){progressSet(20,'Preparando imagem...');await new Promise(r=>setTimeout(r,50));const b=await new Promise((res,rej)=>cv.toBlob(x=>x?res(x):rej(new Error('Falha ao gerar imagem')),'image/png'));progressSet(75,'Salvando imagem...');await saveBlob(b,'imagem-legendada.png');progressSet(100,'Imagem salva.');progressHide();return}
    if(!window.MediaRecorder||!cv.captureStream)throw new Error('Este aparelho não suporta gravação de canvas.');
    const mime=['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw new Error('Nenhum formato de vídeo compatível foi encontrado.');
    let stream;try{stream=cv.captureStream(30)}catch(e){throw new Error('Canvas não pôde ser capturado: '+e.message)}
    try{const src=media.captureStream?media.captureStream():(media.mozCaptureStream?media.mozCaptureStream():null);if(src)src.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(_){ }
    const saveId=window.AndroidSave?AndroidSave.beginSave('video-legendado-'+Date.now()+'.webm','video/webm'):null;let chunks=[];let queue=Promise.resolve();const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000});
    rec.ondataavailable=e=>{if(!e.data||!e.data.size)return;if(saveId)queue=queue.then(()=>blobToAndroid(saveId,e.data));else chunks.push(e.data)};
    const done=new Promise((resolve,reject)=>{rec.onerror=e=>reject(new Error((e.error&&e.error.message)||'Erro na gravação'));rec.onstop=async()=>{try{await queue;if(saveId)AndroidSave.finishSave(saveId);else await saveBlob(new Blob(chunks,{type:mime}),'video-legendado.webm');resolve()}catch(e){reject(e)}}});
    media.pause();media.loop=false;media.muted=false;media.currentTime=0;progressSet(0,'Exportando vídeo... 0%');
    const timer=setInterval(()=>{const d=media.duration||0,t=media.currentTime||0;if(d>0&&isFinite(d))progressSet(Math.min(99,(t/d)*100),'Exportando vídeo... '+Math.round((t/d)*100)+'%')},150);
    media.onended=()=>{try{if(rec.state!=='inactive')rec.stop()}catch(_){ }};rec.start(500);await media.play();await done;clearInterval(timer);progressSet(100,'Vídeo salvo em Filmes/Legendador.');progressHide();
    media.onended=null;media.loop=true;media.muted=true;media.play().catch(()=>{});
  }catch(e){$('msg').textContent='Não foi possível exportar: '+(e&&e.message?e.message:e);$('progress').classList.remove('on');try{if(window.AndroidSave)AndroidSave.cancelSave()}catch(_){ }}finally{exporting=false;sel=keep;selLine=keepLine;$('export').disabled=false;syncDetails()}
};
renderLayerButtons();syncDetails();
</script>
