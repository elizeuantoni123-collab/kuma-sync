<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legendador de Imóveis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@800&family=Fredoka:wght@600&family=Montserrat:wght@800&family=Poppins:wght@800&family=Bebas+Neue&display=swap">
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d1b16;--mut:#6b675d;--line:#d9d5ca;--acc:#f4d90a;--accink:#1d1b16;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17160f;--panel:#23211a;--ink:#f1eee4;--mut:#a29e90;--line:#3a372c}}
:root[data-theme="dark"]{--bg:#17160f;--panel:#23211a;--ink:#f1eee4;--mut:#a29e90;--line:#3a372c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Poppins,system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;max-width:1200px;margin:0 auto}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:8px;gap:8px}.stage{min-height:240px;padding:8px}.side{border-radius:10px}.pane{padding:12px}.tabs button{padding:14px 10px}canvas{max-height:62vh}.btn{min-height:44px}input,select,textarea,button{font-size:16px}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:300px;justify-content:center}
canvas{max-width:100%;max-height:72vh;touch-action:none;background:#000;border-radius:6px;cursor:grab}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:start}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{color:var(--ink);box-shadow:inset 0 -3px var(--acc)}
.pane{padding:14px;display:none;flex-direction:column;gap:10px}.pane.on{display:flex}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px}.row>*{flex:1}
input,select,textarea,button{font:inherit;color:var(--ink)}
textarea,select,input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:84px;resize:vertical}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.btn.d{color:#c0392b}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:4px 10px;cursor:pointer;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layers button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.hint{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="empty" id="empty">Abra um vídeo ou uma imagem na aba Mídia para começar.</div>
    <canvas id="cv" hidden></canvas>
    <div class="row" id="vctl" hidden style="width:100%;max-width:420px"><button class="btn" id="play">Pausar</button></div>
  </div>
  <div class="side">
    <div class="tabs"><button class="on" data-t="m">Mídia</button><button data-t="t">Texto</button></div>
    <div class="pane on" id="m">
      <label>Vídeo ou imagem<input type="file" id="file" accept="video/*,image/*"></label>
      <button class="btn p" id="export" disabled>Baixar resultado</button>
      <div class="hint" id="msg">Imagem sai em PNG. Vídeo é regravado em tempo real e sai em WebM (com áudio, quando o navegador permitir).</div>
    </div>
    <div class="pane" id="t">
      <div class="row"><button class="btn p" id="add">+ Novo texto</button><button class="btn" id="preset">Modelo imóvel</button></div>
      <label>Adicionar imagem por cima (logo, foto)<input type="file" id="ovf" accept="image/*"></label>
      <div class="layers" id="layers"></div>
      <div id="edit" style="display:flex;flex-direction:column;gap:10px">
        <label>Texto<textarea id="tx"></textarea></label>
        <label>Fonte<select id="font">
          <option>Poppins</option><option>Fredoka</option><option>Baloo 2</option><option>Montserrat</option><option>Anton</option><option>Bebas Neue</option>
        </select></label>
        <label id="sizeLabel">Tamanho da linha selecionada <input type="range" id="size" min="2" max="24" step=".1"></label>
        <div class="row"><label>Cor<input type="color" id="fill"></label><label>Contorno<input type="color" id="stroke"></label></div>
        <label>Espessura do contorno <input type="range" id="sw" min="0" max="10" step=".5"></label>
        <label>Sombra <input type="range" id="sh" min="0" max="10" step=".5"></label>
        <button class="btn d" id="del">Excluir texto</button>
        <div class="hint">Toque em uma linha para selecioná-la. Arraste com 1 dedo para mover e use 2 dedos em pinça para aumentar ou diminuir somente essa linha.</div>
      </div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
let media=null,kind=null,layers=[],sel=-1,selLine=0,nid=1,drag=null,exporting=false;
const pointers=new Map();let pinch=null;
const YEL='#f4ee1a';
const mk=(o)=>({id:nid++,text:'Seu texto',font:'Poppins',size:6,lineSizes:[],fill:'#ffffff',stroke:'#000000',sw:3,sh:3,x:.5,y:.5,...o});

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['m','t'].forEach(id=>$(id).classList.toggle('on',id===b.dataset.t));
});

$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  if(f.type.startsWith('video')){
    const v=document.createElement('video');
    v.src=url;v.loop=true;v.muted=true;v.playsInline=true;
    v.onloadedmetadata=()=>{setMedia(v,'video',v.videoWidth,v.videoHeight);v.play()};
  }else{
    const i=new Image();
    i.onload=()=>setMedia(i,'image',i.naturalWidth,i.naturalHeight);
    i.src=url;
  }
};
function setMedia(m,k,w,h){
  media=m;kind=k;pending=null;$('export').textContent='Baixar resultado';
  const s=Math.min(1,1920/Math.max(w,h));
  cv.width=Math.round(w*s);cv.height=Math.round(h*s);
  cv.hidden=false;$('empty').hidden=true;$('export').disabled=false;
  $('vctl').hidden=k!=='video';
  if(!layers.length)preset();
}
$('play').onclick=()=>{if(media.paused){media.play();$('play').textContent='Pausar'}else{media.pause();$('play').textContent='Reproduzir'}};

function draw(){
  if(media){
    const W=cv.width,H=cv.height;
    ctx.clearRect(0,0,W,H);
    try{ctx.drawImage(media,0,0,W,H)}catch(e){}
    layers.forEach((L,i)=>{
      if(L.img){
        const w=L.size/100*W,h=w*L.img.naturalHeight/L.img.naturalWidth;
        ctx.drawImage(L.img,L.x*W-w/2,L.y*H-h/2,w,h);
        L.box={x:L.x*W-w/2,y:L.y*H-h/2,w,h};
        if(i===sel&&!exporting){ctx.save();ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.strokeStyle='#00b4ff';ctx.strokeRect(L.box.x-4,L.box.y-4,w+8,h+8);ctx.restore()}
        return;
      }
      const lines=L.text.split('\n');
      while(L.lineSizes.length<lines.length)L.lineSizes.push(L.size);
      if(L.lineSizes.length>lines.length)L.lineSizes.length=lines.length;
      const metrics=lines.map((ln,j)=>{
        const fs=(L.lineSizes[j]||L.size)/100*W;
        ctx.font=`800 ${fs}px "${L.font}", Poppins, sans-serif`;
        return {ln,fs,w:Math.max(12,ctx.measureText(ln||' ').width),h:fs*1.18};
      });
      const totalH=metrics.reduce((a,m)=>a+m.h,0);
      let cy=L.y*H-totalH/2;
      L.lineBoxes=[];
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      let minX=Infinity,maxX=-Infinity;
      metrics.forEach((m,j)=>{
        const x=L.x*W,y=cy+m.h/2;cy+=m.h;
        ctx.font=`800 ${m.fs}px "${L.font}", Poppins, sans-serif`;
        if(L.sw>0){ctx.shadowColor='transparent';ctx.lineWidth=L.sw*m.fs/30;ctx.strokeStyle=L.stroke;ctx.strokeText(m.ln,x,y)}
        if(L.sh>0){ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=L.sh*m.fs/12;ctx.shadowOffsetX=ctx.shadowOffsetY=L.sh*m.fs/40}
        ctx.fillStyle=L.fill;ctx.fillText(m.ln,x,y);ctx.shadowColor='transparent';
        const b={x:x-m.w/2,y:y-m.h/2,w:m.w,h:m.h};L.lineBoxes[j]=b;minX=Math.min(minX,b.x);maxX=Math.max(maxX,b.x+b.w);
        if(i===sel&&j===selLine&&!exporting){ctx.save();ctx.setLineDash([8,6]);ctx.lineWidth=2;ctx.strokeStyle='#00b4ff';ctx.strokeRect(b.x-6,b.y-4,b.w+12,b.h+8);ctx.restore()}
      });
      if(!isFinite(minX)){minX=L.x*W;maxX=minX}
      L.box={x:minX,y:L.y*H-totalH/2,w:maxX-minX,h:totalH};
      ctx.restore();
    });
  }
  requestAnimationFrame(draw);
}
draw();

const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function hitTest(p){
  for(let i=layers.length-1;i>=0;i--){
    const L=layers[i];
    if(!L.img&&L.lineBoxes){
      for(let j=L.lineBoxes.length-1;j>=0;j--){const b=L.lineBoxes[j];if(b&&p.x>=b.x-10&&p.x<=b.x+b.w+10&&p.y>=b.y-8&&p.y<=b.y+b.h+8)return {i,j}}
    }
    const b=L.box;if(b&&p.x>=b.x-8&&p.x<=b.x+b.w+8&&p.y>=b.y-8&&p.y<=b.y+b.h+8)return {i,j:0};
  }
  return null;
}
cv.onpointerdown=e=>{
  const p=pt(e);pointers.set(e.pointerId,p);cv.setPointerCapture(e.pointerId);
  const hit=hitTest(p);
  if(hit){select(hit.i,hit.j);const L=layers[sel];drag={pointerId:e.pointerId,dx:p.x-L.x*cv.width,dy:p.y-L.y*cv.height};cv.style.cursor='grabbing'}
  else if(pointers.size===1)select(-1);
  if(pointers.size===2&&sel>=0){
    const [a,b]=[...pointers.values()],L=layers[sel];
    const base=L.img?L.size:(L.lineSizes[selLine]||L.size);
    pinch={start:dist(a,b),base};drag=null;
  }
};
cv.onpointermove=e=>{
  if(!pointers.has(e.pointerId))return;const p=pt(e);pointers.set(e.pointerId,p);
  if(pinch&&pointers.size>=2&&sel>=0){
    const [a,b]=[...pointers.values()];const ratio=dist(a,b)/Math.max(1,pinch.start),L=layers[sel];
    const max=L.img?100:24,min=L.img?5:2,n=Math.min(max,Math.max(min,pinch.base*ratio));
    if(L.img)L.size=n;else{while(L.lineSizes.length<=selLine)L.lineSizes.push(L.size);L.lineSizes[selLine]=n;$('size').value=n}
    return;
  }
  if(drag&&drag.pointerId===e.pointerId&&sel>=0){const L=layers[sel];L.x=Math.min(1,Math.max(0,(p.x-drag.dx)/cv.width));L.y=Math.min(1,Math.max(0,(p.y-drag.dy)/cv.height))}
};
function pointerEnd(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size){drag=null;cv.style.cursor='grab'}}
cv.onpointerup=pointerEnd;cv.onpointercancel=pointerEnd;

const F={tx:'text',font:'font',size:'size',fill:'fill',stroke:'stroke',sw:'sw',sh:'sh'};
Object.keys(F).forEach(id=>$(id).oninput=()=>{
  const L=layers[sel];if(!L)return;
  const v=$(id).value;
  if(id==='size'&&!L.img){while(L.lineSizes.length<=selLine)L.lineSizes.push(L.size);L.lineSizes[selLine]=+v}
  else L[F[id]]=['size','sw','sh'].includes(id)?+v:v;
  if(id==='tx'){const n=L.text.split('\n').length;while(L.lineSizes.length<n)L.lineSizes.push(L.size);if(selLine>=n)selLine=Math.max(0,n-1);renderLayers()}
});
function select(i,line=0){sel=i;selLine=line;renderLayers();syncEdit()}
function syncEdit(){
  const L=layers[sel];$('edit').style.display=L?'flex':'none';
  if(!L)return;
  ['tx','font','fill','stroke','sw','sh'].forEach(id=>$(id).closest('label').style.display=L.img?'none':'flex');
  $('size').max=L.img?100:24;
  Object.keys(F).forEach(id=>{
    if(!L.img||id==='size'){
      if(id==='size'&&!L.img){while(L.lineSizes.length<=selLine)L.lineSizes.push(L.size);$(id).value=L.lineSizes[selLine]||L.size}
      else $(id).value=L[F[id]];
    }
  });
  $('sizeLabel').firstChild.textContent=L.img?'Tamanho da imagem ':'Tamanho da linha '+(selLine+1)+' ';
}
function renderLayers(){
  const box=$('layers');box.innerHTML='';
  layers.forEach((L,i)=>{const b=document.createElement('button');
    b.textContent=L.img?'Imagem':(L.text.split('\n')[0]||'(vazio)');b.className=i===sel?'on':'';b.onclick=()=>select(i);box.appendChild(b)});
}
$('add').onclick=()=>{layers.push(mk({}));select(layers.length-1);document.querySelector('[data-t=t]').click()};
$('ovf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const i=new Image();
  i.onload=()=>{layers.push(mk({img:i,size:30,x:.5,y:.8}));select(layers.length-1);e.target.value=''};
  i.src=URL.createObjectURL(f);
};
$('del').onclick=()=>{if(sel<0)return;layers.splice(sel,1);select(-1)};
function preset(){
  layers=[
    mk({text:'Sobrado à Venda\nBalneário Camboriú',font:'Poppins',size:6.6,fill:YEL,y:.17,sw:3,sh:4}),
    mk({text:'02 Dormitórios\n02 Banheiros\n01 Vaga garagem privativa\n55,06 área privativa\nÁrea de Lazer Completa',font:'Poppins',size:5,fill:'#ffffff',y:.34,sw:3,sh:4}),
    mk({text:'R$ 780.000,00',font:'Poppins',size:9,fill:YEL,y:.5,sw:3,sh:4})
  ];
  select(0);
}
$('preset').onclick=()=>{preset();document.querySelector('[data-t=t]').click()};
select(-1);

let pending=null;
async function save(blob,name){
  if(window.AndroidSave){
    try{
      $('msg').textContent='Salvando no aparelho...';
      const id=AndroidSave.beginSave(name,blob.type||'application/octet-stream');
      const CHUNK=512*1024;
      for(let off=0;off<blob.size;off+=CHUNK){
        const ab=await blob.slice(off,Math.min(off+CHUNK,blob.size)).arrayBuffer();
        const bytes=new Uint8Array(ab);
        let bin='';
        const STEP=0x8000;
        for(let i=0;i<bytes.length;i+=STEP){
          bin+=String.fromCharCode(...bytes.subarray(i,Math.min(i+STEP,bytes.length)));
        }
        AndroidSave.appendChunk(id,btoa(bin));
      }
      AndroidSave.finishSave(id);
      $('msg').textContent='Arquivo salvo no aparelho.';
      return;
    }catch(e){
      try{AndroidSave.cancelSave()}catch(_){}
      $('msg').textContent='Falha ao salvar no Android: '+(e&&e.message?e.message:e);
      return;
    }
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('export').onclick=async()=>{
  if(!media)return;
  if(pending){const p=pending;pending=null;$('export').textContent='Baixar resultado';await save(p.b,p.n);return}
  const keep=sel;sel=-1;exporting=true;
  if(kind==='image'){
    await new Promise(r=>setTimeout(r,60));
    cv.toBlob(b=>{save(b,'imagem-legendada.png');exporting=false;sel=keep});
    return;
  }
  const v=media,btn=$('export');
  if(!window.MediaRecorder){$('msg').textContent='Este aparelho não suporta gravação de vídeo pelo WebView.';exporting=false;sel=keep;return}
  const stream=cv.captureStream(30);
  try{const as=(v.captureStream?v.captureStream():v.mozCaptureStream()).getAudioTracks();as.forEach(t=>stream.addTrack(t))}catch(e){}
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8e6}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{pending={b:new Blob(chunks,{type:'video/webm'}),n:'video-legendado.webm'};
    v.loop=true;v.muted=true;v.onended=null;v.play();exporting=false;sel=keep;btn.disabled=false;btn.textContent='Salvar vídeo pronto';$('msg').textContent='Vídeo gravado. Toque em "Salvar vídeo pronto".'};
  btn.disabled=true;btn.textContent='Gravando...';$('msg').textContent='Gravando o vídeo inteiro em tempo real, aguarde.';
  v.loop=false;v.muted=false;v.currentTime=0;
  v.onended=()=>rec.stop();
  rec.start();v.play();
};
</script>
</body>
</html>
